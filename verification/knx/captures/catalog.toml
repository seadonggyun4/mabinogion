version = 1

[[captures]]
id = "xknx-group-io-transcript"
source = "Phase 2/3 XKNX shared transcript seed"
source_tool = "xknx"
license_note = "Curated transcript metadata only; no XKNX source or generated binary artifact is vendored."
protocol_area = "tunnelling_group_io"
profile_ids = ["xknx_canary", "group_io"]
capability_ids = ["discovery", "tunneling_connect", "connection_state", "group_value_read_write"]
artifact_dir = "xknx/group-io-transcript"
expected_behavior = "Search and description succeed, tunnelling state succeeds, and group write/read returns value 42."
ci_executable = false
curation_state = "seeded"

  [[captures.artifacts]]
  role = "manifest"
  path = "xknx/group-io-transcript/manifest.toml"
  format = "toml"

  [[captures.artifacts]]
  role = "replay"
  path = "xknx/group-io-transcript/replay.json"
  format = "json"

  [[captures.artifacts]]
  role = "transcript"
  path = "xknx/group-io-transcript/transcript.json"
  format = "json"

  [[captures.artifacts]]
  role = "runbook"
  path = "xknx/group-io-transcript/runbook.md"
  format = "markdown"

