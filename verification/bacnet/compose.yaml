services:
  bacpypes3-canary:
    build:
      context: ../..
      dockerfile: verification/bacnet/harness/bacpypes3/Dockerfile
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    environment:
      CARGO_TARGET_DIR: /tmp/mabi-bacnet-interop/bacpypes3
    entrypoint:
      - bash
      - /workspace/verification/bacnet/harness/bacpypes3/run.sh
  bacpypes3-yabe-sequence:
    build:
      context: ../..
      dockerfile: verification/bacnet/harness/bacpypes3/Dockerfile
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    environment:
