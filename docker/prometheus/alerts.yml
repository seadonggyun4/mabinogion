# =============================================================================
# Prometheus Alert Rules for TRAP Simulator
# =============================================================================

groups:
  # ---------------------------------------------------------------------------
  # Simulator Health Alerts
  # ---------------------------------------------------------------------------
  - name: simulator_health
    rules:
      - alert: SimulatorDown
        expr: up{job="mabinogion"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "OTSIM Simulator is down"
          description: "The OTSIM Simulator instance {{ $labels.instance }} has been down for more than 1 minute."

      - alert: SimulatorHighCPU
        expr: process_cpu_seconds_total{job="mabinogion"} > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on simulator"
          description: "CPU usage is above 80% for more than 5 minutes on {{ $labels.instance }}."

      - alert: SimulatorHighMemory
        expr: process_resident_memory_bytes{job="mabinogion"} > 4e9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on simulator"
          description: "Memory usage is above 4GB for more than 5 minutes on {{ $labels.instance }}."

  # ---------------------------------------------------------------------------
  # Performance Alerts
  # ---------------------------------------------------------------------------
  - name: simulator_performance
    rules:
      - alert: HighRequestLatency
        expr: histogram_quantile(0.99, sum(rate(trap_sim_request_duration_seconds_bucket[5m])) by (le, protocol)) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High request latency detected"
          description: "P99 latency for {{ $labels.protocol }} is above 100ms."

      - alert: HighErrorRate
        expr: rate(trap_sim_request_errors_total[5m]) / rate(trap_sim_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 5% for {{ $labels.protocol }}."

      - alert: LowThroughput
        expr: rate(trap_sim_requests_total[5m]) < 100
        for: 10m
        labels:
          severity: info
        annotations:
          summary: "Low request throughput"
          description: "Request throughput is below 100 req/s for {{ $labels.protocol }}."

  # ---------------------------------------------------------------------------
  # Capacity Alerts
  # ---------------------------------------------------------------------------
  - name: simulator_capacity
    rules:
      - alert: HighDeviceCount
        expr: trap_sim_devices_total > 40000
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High device count"
          description: "Device count is approaching the limit ({{ $value }}/50000)."

      - alert: HighConnectionCount
        expr: trap_sim_active_connections > 8000
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High connection count"
          description: "Active connections for {{ $labels.protocol }} is high ({{ $value }})."

      - alert: TickLoopSlow
        expr: trap_sim_tick_duration_seconds > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Tick loop is running slow"
          description: "Engine tick duration is above 500ms, indicating performance issues."
