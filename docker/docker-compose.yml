# =============================================================================
# mabinogion Docker Compose Configuration
# =============================================================================
#
# This configuration provides a complete development and testing environment
# including the simulator, metrics collection, and visualization.
#
# Usage:
#   docker-compose up -d                    # Start all services
#   docker-compose up -d simulator          # Start simulator only
#   docker-compose --profile stress up -d   # Include stress testing tools
#   docker-compose logs -f simulator        # View simulator logs
#   docker-compose down -v                  # Stop and remove volumes
#
# Profiles:
#   - default: Core services (simulator, prometheus, grafana)
#   - stress:  Stress testing tools (k6, locust)
#   - debug:   Debug tools (jaeger tracing)
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # OTSIM Simulator
  # ---------------------------------------------------------------------------
  simulator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: mabinogion
    restart: unless-stopped
    ports:
      - "502:502"       # Modbus TCP
      - "4840:4840"     # OPC UA
      - "47808:47808/udp"  # BACnet/IP
      - "3671:3671/udp"    # KNXnet/IP
      - "8080:8080"     # Web UI / REST API
      - "9090:9090"     # Prometheus metrics
    volumes:
      - ./config:/app/config:ro
      - simulator-logs:/app/logs
      - simulator-data:/app/data
      - ../scenarios:/app/scenarios:ro
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - TRAP_SIM_TICK_INTERVAL_MS=${TICK_INTERVAL:-100}
      - TRAP_SIM_MAX_DEVICES=${MAX_DEVICES:-10000}
      - TRAP_SIM_WEB_PORT=8080
      - TRAP_SIM_METRICS_PORT=9090
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - trap-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 512M

  # ---------------------------------------------------------------------------
  # Prometheus - Metrics Collection
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: trap-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    networks:
      - trap-network
    depends_on:
      - simulator

  # ---------------------------------------------------------------------------
  # Grafana - Visualization
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.2.2
    container_name: trap-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
    networks:
      - trap-network
    depends_on:
      - prometheus

  # ---------------------------------------------------------------------------
  # Redis - Optional caching (for large-scale scenarios)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: trap-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - trap-network
    profiles:
      - cache

  # ---------------------------------------------------------------------------
  # Stress Testing - k6
  # ---------------------------------------------------------------------------
  k6:
    image: grafana/k6:0.48.0
    container_name: trap-k6
    volumes:
      - ../tests/stress:/scripts:ro
    environment:
      - K6_OUT=influxdb=http://influxdb:8086/k6
    networks:
      - trap-network
    profiles:
      - stress
    depends_on:
      - simulator

  # ---------------------------------------------------------------------------
  # InfluxDB - For k6 metrics (stress testing profile)
  # ---------------------------------------------------------------------------
  influxdb:
    image: influxdb:1.8-alpine
    container_name: trap-influxdb
    ports:
      - "8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb
    environment:
      - INFLUXDB_DB=k6
      - INFLUXDB_ADMIN_USER=admin
      - INFLUXDB_ADMIN_PASSWORD=admin123
    networks:
      - trap-network
    profiles:
      - stress

  # ---------------------------------------------------------------------------
  # Jaeger - Distributed Tracing (debug profile)
  # ---------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: trap-jaeger
    ports:
      - "5775:5775/udp"
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"   # Web UI
      - "14250:14250"
      - "14268:14268"
      - "14269:14269"
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      - COLLECTOR_ZIPKIN_HOST_PORT=:9411
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - trap-network
    profiles:
      - debug

# =============================================================================
# Networks
# =============================================================================
networks:
  trap-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

# =============================================================================
# Volumes
# =============================================================================
volumes:
  simulator-logs:
  simulator-data:
  prometheus-data:
  grafana-data:
  redis-data:
  influxdb-data:
