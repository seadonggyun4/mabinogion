[package]
name = "mabi-scenario"
description = "Mabinogion - Scenario engine for time-based simulation orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/mabi-scenario"
readme = "README.md"
keywords = ["scenario", "simulation", "testing", "orchestration", "industrial"]
categories = ["simulation", "development-tools::testing"]

[dependencies]
mabi-core = { version = "1.1.7", path = "../mabi-core" }

tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tempfile = { workspace = true }
