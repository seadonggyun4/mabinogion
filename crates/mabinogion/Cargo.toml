[package]
name = "mabinogion"
description = "Industrial protocol simulator for Modbus, OPC UA, BACnet, and KNX - stress testing and chaos engineering for protocol clients"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/seadonggyun4/mabinogion"
documentation = "https://docs.rs/mabinogion"
readme = "README.md"
keywords = ["industrial", "protocol", "simulator", "modbus", "opcua"]
categories = ["simulation", "network-programming", "development-tools::testing"]

[features]
default = ["modbus", "opcua", "bacnet", "knx", "scenario", "chaos"]
modbus = ["dep:mabi-modbus"]
opcua = ["dep:mabi-opcua"]
bacnet = ["dep:mabi-bacnet"]
knx = ["dep:mabi-knx"]
scenario = ["dep:mabi-scenario"]
chaos = ["dep:mabi-chaos"]
cli = ["dep:mabi-cli", "dep:clap", "dep:console", "dep:humantime", "dep:tokio"]
full = ["modbus", "opcua", "bacnet", "knx", "scenario", "chaos", "cli"]

[[bin]]
name = "mabi"
path = "src/bin/mabi.rs"
required-features = ["cli"]

[dependencies]
# Core (always included)
mabi-core = { path = "../mabi-core" }

# Protocol simulators (optional)
mabi-modbus = { path = "../mabi-modbus", optional = true }
mabi-opcua = { path = "../mabi-opcua", optional = true }
mabi-bacnet = { path = "../mabi-bacnet", optional = true }
mabi-knx = { path = "../mabi-knx", optional = true }

# Engines (optional)
mabi-scenario = { path = "../mabi-scenario", optional = true }
mabi-chaos = { path = "../mabi-chaos", optional = true }

# CLI (optional)
mabi-cli = { path = "../mabi-cli", optional = true }
clap = { version = "4.4", features = ["derive", "env", "wrap_help", "color"], optional = true }
console = { version = "0.15", optional = true }
humantime = { version = "2.1", optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
