[package]
name = "mabi-chaos"
description = "Mabinogion - Chaos engineering module for fault injection and resilience testing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/mabi-chaos"
readme = "README.md"
keywords = ["chaos-engineering", "fault-injection", "testing", "resilience", "simulation"]
categories = ["simulation", "development-tools::testing"]

[dependencies]
mabi-core = { version = "1.1.1", path = "../mabi-core" }

tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
rand = { workspace = true }
rand_distr = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true }
parking_lot = { workspace = true }
glob = "0.3"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
