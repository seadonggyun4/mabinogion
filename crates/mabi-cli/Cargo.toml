[package]
name = "mabi-cli"
description = "Mabinogion - Industrial Protocol Simulator CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/mabi-cli"
readme = "README.md"
keywords = ["cli", "industrial", "protocol", "simulator", "modbus"]
categories = ["command-line-utilities", "simulation"]

[[bin]]
name = "mabi"
path = "src/main.rs"

[dependencies]
# Workspace crates
mabi-core = { version = "1.3.1", path = "../mabi-core" }
mabi-modbus = { version = "1.3.1", path = "../mabi-modbus" }
mabi-opcua = { version = "1.3.1", path = "../mabi-opcua" }
mabi-bacnet = { version = "1.3.1", path = "../mabi-bacnet" }
mabi-knx = { version = "1.3.1", path = "../mabi-knx" }
mabi-scenario = { version = "1.3.1", path = "../mabi-scenario" }
mabi-chaos = { version = "1.3.1", path = "../mabi-chaos" }

# Async runtime
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true

# CLI framework
clap = { version = "4.4", features = ["derive", "env", "wrap_help", "color"] }
clap_complete = "4.4"

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Terminal UI
console = "0.15"
indicatif = "0.17"
dialoguer = "0.11"
comfy-table = "7.1"

# Utilities
chrono.workspace = true
humantime = "2.1"
humansize = "2.1"
ctrlc = "3.4"
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
assert_cmd = "2.0"
predicates = "3.1"
