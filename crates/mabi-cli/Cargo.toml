[package]
name = "mabi-cli"
description = "Mabinogion - Industrial Protocol Simulator CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/mabi-cli"
readme = "README.md"
keywords = ["cli", "industrial", "protocol", "simulator", "modbus"]
categories = ["command-line-utilities", "simulation"]

[features]
default = []
# Opt in to OPC UA Binary over HTTPS. The default installed CLI keeps this
# disabled so `cargo install mabi-cli` remains lightweight on Windows.
opcua-https = ["mabi-opcua/https"]

[[bin]]
name = "mabi"
path = "src/main.rs"

[dependencies]
# Workspace crates
mabi-core = { workspace = true }
mabi-modbus = { workspace = true }
mabi-opcua = { workspace = true }
mabi-bacnet = { workspace = true }
mabi-knx = { workspace = true }
mabi-scenario = { workspace = true }
mabi-chaos = { workspace = true }
mabi-runtime = { workspace = true }

# Async runtime
tokio.workspace = true
async-trait.workspace = true
futures.workspace = true

# CLI framework
clap = { version = "4.4", features = ["derive", "env", "wrap_help", "color"] }
clap_complete = "4.4"

# Serialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true

# Error handling
thiserror.workspace = true
anyhow.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# Terminal UI
console = "0.15"
indicatif = "0.17"
dialoguer = "0.11"
comfy-table = "7.1"

# Utilities
chrono.workspace = true
humantime = "2.1"
humansize = "2.1"
ctrlc = "3.4"
libc = "0.2"
parking_lot.workspace = true

[dev-dependencies]
tempfile.workspace = true
assert_cmd = "2.0"
predicates = "3.1"
