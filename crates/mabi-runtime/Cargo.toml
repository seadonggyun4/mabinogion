[package]
name = "mabi-runtime"
description = "Mabinogion shared runtime contracts and service orchestration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/mabi-runtime"
readme = "README.md"
keywords = ["runtime", "service", "industrial", "simulator", "protocol"]
categories = ["simulation", "development-tools::testing"]

[dependencies]
mabi-core = { workspace = true }

tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
chrono = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
