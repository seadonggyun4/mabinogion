[package]
name = "mabi-opcua"
description = "Mabinogion - OPC UA server simulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/mabi-opcua"
readme = "README.md"
keywords = ["opcua", "opc-ua", "protocol", "simulator", "industrial"]
categories = ["simulation", "network-programming"]

[package.metadata.mabi-opcua]
public_surface = "canonical-only"
compat_migration_docs = "current-release-line"
compat_residual_removal_target = "next-major"
external_interop_policy = "compose-self-contained"
perf_contract_policy = "release-only-ignored"

[features]
default = []
# Enable full OPC UA server implementation (requires opcua crate)
full = []
# Experimental in-process namespace manager plugin surface.
experimental-namespace-api = []

[dependencies]
mabi-core = { workspace = true }
mabi-runtime = { workspace = true }

# Async
tokio = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
toml = { workspace = true }

# Error handling
thiserror = { workspace = true }
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }

# Concurrency
dashmap = { workspace = true }
parking_lot = { workspace = true }
crossbeam = { workspace = true }
rayon = "1.10"
num_cpus = "1.16"

# Time
chrono = { workspace = true }

# Utilities
uuid = { workspace = true }
bytes = { workspace = true }
num-traits = { workspace = true }
num-derive = { workspace = true }
lru = "0.12"
rustls = "0.23"
tokio-rustls = "0.26"
rustls-pemfile = "2.2"

# Metrics
prometheus = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
criterion = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }

[[bench]]
name = "opcua_bench"
harness = false
