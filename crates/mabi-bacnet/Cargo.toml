[package]
name = "mabi-bacnet"
description = "Mabinogion - BACnet/IP simulator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/mabi-bacnet"
readme = "README.md"
keywords = ["bacnet", "protocol", "simulator", "building-automation", "hvac"]
categories = ["simulation", "network-programming"]

[dependencies]
mabi-core = { version = "1.1.6", path = "../mabi-core" }

# Async
tokio = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }

# Serialization
serde = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Logging
tracing = { workspace = true }

# Concurrency
dashmap = { workspace = true }
parking_lot = { workspace = true }

# Networking
bytes = { workspace = true }
socket2 = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
