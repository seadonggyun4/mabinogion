schema_version: 1
contract_id: unified-readiness-contract-v1
status: active
owner: mabinogion
purpose: >
  Normalize protocol capability and profile metadata so mabinogion-trials can
  bind MVP corpus entries to stable engine readiness surfaces.
non_goals:
  - define trial suites
  - score trial results
  - publish proof reports
  - issue certifications
profile_required_fields:
  - capability_id
  - profile_id
  - lane
  - coverage_status
  - optional_interop_policy
  - trial_profile_id
  - trial_level
  - required_evidence
  - engine_requirement
  - forge_display_label
enums:
  lanes:
    - deterministic
    - ignored_interop
    - release_only_perf
    - artifact_only_capture
  coverage_status:
    - implemented
    - partial
    - planned
    - unsupported_recorded
    - future
  optional_interop_policy:
    - none
    - nightly
    - manual
    - release_only
    - capture_only
    - future
trial_profile_id:
  format: protocol.lN.capability
  examples:
    - opcua.l1.session_lifecycle
    - bacnet.l3.segmentation
    - modbus.l2.multi_unit
    - knx.l2.sequence_validation
evidence_types:
  - runtime_snapshot
  - protocol_exchange
  - log
  - metric
  - replay
  - artifact
  - report_field
engine_requirements:
  runtime_contract: runtime-contract-v1
  snapshot_metadata_contract: snapshot-metadata-v1
  readiness_report_contract: service-readiness-report-v1
protocols:
  - id: opcua
    crate: mabi-opcua
    contract: docs/opcua-simulator/verification-contract.yaml
    baseline: docs/opcua-simulator/verification-baseline.md
    scope: OPC UA simulator profile readiness.
  - id: bacnet
    crate: mabi-bacnet
    contract: docs/bacnet-simulator/verification-contract.yaml
    baseline: docs/bacnet-simulator/verification-baseline.md
    scope: BACnet/IP simulator profile readiness.
  - id: modbus
    crate: mabi-modbus
    contract: docs/modbus-simulator/verification-contract.yaml
    baseline: docs/modbus-simulator/verification-baseline.md
    scope: Modbus simulator profile readiness.
  - id: knx
    crate: mabi-knx
    contract: docs/knx-simulator/verification-contract.yaml
    baseline: docs/knx-simulator/verification-baseline.md
    scope: KNXnet/IP simulator profile readiness.
maintenance_policy:
  profile_id_stability: >
    Profile IDs are stable contract identifiers. Rename only through a
    readiness-contract version bump and a compatibility note.
  capability_id_stability: >
    Capability IDs are stable semantic anchors for Trials MVP corpus mapping.
    Split or merge only through an explicit contract update.
  lane_policy: >
    The lane describes how evidence can be collected, not whether the feature
    is valuable. Heavy interop, perf, and capture paths stay out of the
    default deterministic lane.
  ownership_boundary: >
    mabinogion exports protocol/session readiness metadata. Trial definitions,
    scoring, proof report publication, and certification issuance remain
    outside this repository.
