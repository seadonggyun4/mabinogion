    local_test_refs:
      - /Users/dgseo/Desktop/trap-project/mabinogion/crates/mabi-modbus/src/control.rs
    gap_summary: Recent control-plane operations are retained in an in-memory bounded buffer with clear and subscribe support.
    acceptance: Trace tail and clear are predictable and do not become unbounded memory growth.
