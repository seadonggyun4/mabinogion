    capability_version: modbus-capabilities-v1
    readiness_matrix_version: protocol-readiness-matrix-v2
    readiness_contract_version: unified-readiness-contract-v2
    profile_ids:
      - function_code_core
      - register_map
      - exception_response
      - multi_unit
      - timeout
      - partial_response
      - slow_device
    breaking_change_scope:
      - config
      - runtime_contract
      - readiness_contract
      - run_evidence_schema
      - version_metadata_contract
  - protocol_key: opcua
    capability_version: opcua-capabilities-v1
    readiness_matrix_version: protocol-readiness-matrix-v2
    readiness_contract_version: unified-readiness-contract-v2
    profile_ids:
      - session_lifecycle
      - secure_channel_renewal
      - reconnect
      - subscription
      - timeout
      - malformed_service_response
      - operation_limit
    breaking_change_scope:
      - config
      - runtime_contract
      - readiness_contract
      - run_evidence_schema
      - version_metadata_contract
  - protocol_key: bacnet
    capability_version: bacnet-capabilities-v1
    readiness_matrix_version: protocol-readiness-matrix-v2
    readiness_contract_version: unified-readiness-contract-v2
    profile_ids:
      - basic_ip
      - property_io
      - cov_flow
      - segmentation
      - bbmd_fdr
      - tsm_resilience
    breaking_change_scope:
      - config
      - runtime_contract
      - readiness_contract
      - run_evidence_schema
      - version_metadata_contract
  - protocol_key: knx
    capability_version: knx-capabilities-v1
    readiness_matrix_version: protocol-readiness-matrix-v2
    readiness_contract_version: unified-readiness-contract-v2
    profile_ids:
      - basic_discovery
      - tunnel_lifecycle
      - group_io
      - dpt_matrix
      - tunnel_resilience
      - heartbeat_timeout
    breaking_change_scope:
      - config
      - runtime_contract
      - readiness_contract
      - run_evidence_schema
      - version_metadata_contract
ownership_boundary:
  mabinogion_owns:
    - engine_release_metadata
    - protocol_capability_metadata
    - contract_version_metadata
  not_owned_by_mabinogion:
    - runner_admission_decision
    - scoring_policy
    - certification_issuance
