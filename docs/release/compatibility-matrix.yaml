schema_version: 1
matrix_id: mabinogion-engine-compatibility
matrix_version: compatibility-matrix-v2
current_engine_version: "1.7.1"
engine_version_range: ">=1.7.1 <2.0.0"
workspace_rust_version: "1.75"
release_channel: source-build
version_metadata_contract: version-metadata-contract-v2
readiness_matrix_version: protocol-readiness-matrix-v2
runner_policy_document: docs/release/release-checklist.md
release_policy_document: docs/release/release-checklist.md
changelog_policy_document: docs/release/changelog-policy.md
compatibility_decision_owner: external-consumer
supported_contract_versions:
  - local-runner-contract-v1
  - cli-output-envelope-v1
  - runtime-contract-v1
  - snapshot-metadata-v1
  - unified-readiness-contract-v2
  - run-evidence-schema-v2
  - replay-artifact-contract-v1
  - version-metadata-contract-v2
protocol_capabilities:
