# Dependabot configuration for mabinogion
# https://docs.github.com/en/code-security/dependabot

version: 2

registries:
  crates-io:
    type: cargo-registry
    url: https://crates.io

updates:
  # Rust dependencies
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 10
    reviewers:
      - sylvex/trap-team
    labels:
      - dependencies
      - rust
    commit-message:
      prefix: "deps(rust)"
    groups:
      # Group minor/patch updates together
      rust-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      # Keep major updates separate
      rust-major:
        patterns:
          - "*"
        update-types:
          - major
    ignore:
      # Ignore pre-release versions
      - dependency-name: "*"
        update-types: ["version-update:semver-prerelease"]

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    reviewers:
      - sylvex/trap-team
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-minor:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
